version: '3.8'

services:
  propval-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_USERNAME:-letera}/house-price-prediction:2.0.0
    container_name: propval-ml-api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - FLASK_ENV=production
      - LOG_LEVEL=INFO
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; exit(0 if urllib.request.urlopen('http://localhost:8080/health').getcode() == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - propval-net

networks:
  propval-net:
    driver: bridge
