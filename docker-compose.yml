version: '3.8'

services:
  # ============================================================================
  # Backend Machine Learning Inference API (Flask + Gunicorn + Scikit-Learn)
  # ============================================================================
  propval-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${DOCKER_USERNAME:-tuta699}/house-price-prediction-api:2.0.0
    container_name: propval-ml-api
    restart: unless-stopped
    ports:
      # Bind exclusively to loopback to prevent external WAN/LAN exposure
      - "127.0.0.1:8080:8080"
    environment:
      - PORT=8080
      - FLASK_ENV=production
      - LOG_LEVEL=INFO
    volumes:
      - ./backend/models:/app/models:ro
    # Defense-in-Depth Security Controls
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    # Resource Limits (Prevent DoS & Memory Runaway)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; exit(0 if urllib.request.urlopen('http://localhost:8080/health').getcode() == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      propval-tier:
        ipv4_address: 172.28.0.10

  # ============================================================================
  # Frontend Application (Next.js 16 Standalone Production Server)
  # ============================================================================
  propval-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${DOCKER_USERNAME:-tuta699}/house-price-prediction-frontend:2.0.0
    container_name: propval-web
    restart: unless-stopped
    ports:
      # Bind exclusively to loopback
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/predict"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      propval-api:
        condition: service_healthy
    networks:
      propval-tier:
        ipv4_address: 172.28.0.20

# ==============================================================================
# Isolated Network with Explicit CIDR Subnet
# ==============================================================================
networks:
  propval-tier:
    driver: bridge
    name: propval-custom-bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
